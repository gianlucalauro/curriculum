name: Render CV

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render-cv:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install RenderCV
        run: |
          python -m pip install --upgrade pip
          pip install "rendercv[full]"

      - name: Render CV
        run: |
          rendercv render Gianluca_Lauro_CV.yaml

      - name: Upload CV Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RenderCV-Output
          path: rendercv_output/

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: latest
          name: "CV - Latest Release"
          body: "Automated build generated by RenderCV."
          files: |
            rendercv_output/*.pdf
            rendercv_output/*.html
            rendercv_output/*.md
